# ─── PilotHouse POS — Electron Builder Configuration ──────────────────────────
#
# BUILD INSTRUCTIONS (run on your local dev machine, not on Replit):
#
#   1.  npm install          # installs electron-builder + other devDeps
#   2.  npm run build:electron
#
# OUTPUT: dist/installers/
#   Windows:  PilotHouse POS Setup x.y.z.exe  (NSIS one-click)
#   macOS:    PilotHouse POS-x.y.z.dmg        (drag-to-Applications)
#
# SERVER URL
#   Set PILOTHOUSE_SERVER_URL below (or as an env var) before distributing.
#   Staff will connect to whatever URL you specify here.

appId: com.pilothouse.pos
productName: PilotHouse POS

# The compiled Electron main process entry point
main: dist/electron/main.js

directories:
  buildResources: electron/assets
  output: dist/installers

# ── What to include in the installer ─────────────────────────────────────────
# We only bundle the Electron shell + its native modules.
# The React frontend is served from the remote server (SERVER_URL) — not bundled.
files:
  # Compiled main process and preload
  - dist/electron/**/*
  # Bundled React frontend — served locally so the app loads without internet
  - dist/public/**/*
  # Required for electron-updater and serialport
  - package.json
  - node_modules/electron-updater/**/*
  - node_modules/builder-util-runtime/**/*
  - node_modules/serialport/**/*
  - node_modules/@serialport/**/*
  - node_modules/node-addon-api/**/*

# Native modules must be rebuilt against Electron's Node.js ABI
nativeRebuilder: sequential
buildDependenciesFromSource: false

# ── Environment variables baked into the app at build time ───────────────────
extraMetadata:
  main: dist/electron/main.js

# SERVER_URL is baked into the binary by scripts/write-electron-env.js, which
# runs as part of `npm run build:electron:main` (before tsc compiles main.ts).
# The script reads PILOTHOUSE_SERVER_URL from the environment and writes it to
# electron/env-constants.ts, which is imported by main.ts.
#
# In CI (GitHub Actions), set the PILOTHOUSE_SERVER_URL Actions secret to your
# production URL (e.g. https://pilothouse.replit.app) so the packaged binary
# connects to the correct host out of the box.
#
# For a local distribution build without the secret, the script falls back to
# https://pilothouse.replit.app, which is the production default.

# ── Auto-update — GitHub Releases ────────────────────────────────────────────
# electron-updater checks this provider on launch and prompts staff to update
# whenever a newer release tag exists on GitHub.
# owner/repo are auto-detected from GITHUB_REPOSITORY in CI; set them
# explicitly here if you build locally with `GH_TOKEN` configured.
# ── Notarization hook (macOS only) ───────────────────────────────────────────
# afterSign is a top-level electron-builder hook invoked after the .app bundle
# is code-signed.  Our script zips the app, submits it to Apple via
# `xcrun notarytool --wait`, then staples the ticket.
# It is a no-op on non-macOS builds or when APPLE_ID is not set.
afterSign: electron/notarize.js

publish:
  - provider: github
    releaseType: release

# ── macOS DMG ─────────────────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch:
        - x64    # Intel Mac
        - arm64  # Apple Silicon

  # Code-signing identity — must match the Common Name of the Developer ID
  # Application certificate imported into the macOS keychain in CI.
  #
  # Do NOT set `identity: null` here — that would explicitly disable signing
  # even when the certificate has been imported into the keychain.  Leaving
  # the field absent lets electron-builder auto-discover the identity from the
  # keychain.  The CI job imports the cert before calling electron-builder, so
  # the correct "Developer ID Application: …" identity is always found.
  #
  # Local dev builds without the cert will produce an unsigned DMG with a
  # warning, which is fine for testing.  The CI pre-build guard (in
  # .github/workflows/build-electron.yml) ensures the cert is valid before
  # the build ever reaches this point in CI.

  # Hardened runtime is required for notarization.
  hardenedRuntime: true

  # Entitlements allow the JIT / unsigned-executable memory needed by Electron.
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist

# ── Windows NSIS installer ────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: electron/assets/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PilotHouse POS
