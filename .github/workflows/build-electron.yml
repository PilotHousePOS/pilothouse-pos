# ─── PilotHouse POS — Electron Installer CI ───────────────────────────────────
#
# Triggered automatically when a version tag (e.g. v1.2.3) is pushed.
# Produces and attaches a Windows NSIS installer and a macOS DMG to the
# GitHub Release that corresponds to the tag.
#
# Required GitHub Actions secrets:
#   PILOTHOUSE_SERVER_URL        — production URL the packaged app should
#                                  connect to (e.g. https://pilothouse.replit.app)
#
# Required GitHub Actions secrets for macOS code-signing + notarization:
#   APPLE_CERTIFICATE            — base64-encoded Developer ID Application .p12
#                                  export (openssl base64 -in cert.p12 | pbcopy)
#   APPLE_CERTIFICATE_PASSWORD   — password used when exporting the .p12
#   APPLE_ID                     — Apple Developer account email address
#   APPLE_APP_SPECIFIC_PASSWORD  — app-specific password from appleid.apple.com
#                                  (NOT the Apple ID login password)
#   APPLE_TEAM_ID                — 10-character Team ID from developer.apple.com
#
# The built-in GITHUB_TOKEN is used to upload release assets; no extra
# personal-access token is needed as long as the repository's Actions
# settings allow "Read and write permissions" for the GITHUB_TOKEN.

name: Build and Publish Electron Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  # ── Windows ──────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # npm 12 (bundled with Node 24) emits "Exit handler never called!" at the
        # end of npm ci but still exits 0 and writes all packages to disk. The
        # error is a benign npm 12 regression; a single run is sufficient.
        # --ignore-scripts skips native-addon compilation (serialport/electron
        # binary download) that can crash the npm process on Node 24 runners;
        # electron-builder rebuilds native modules for the correct Electron ABI.
        run: npm ci --ignore-scripts

      - name: Ensure electron-builder CLI is present
        # npm 12 non-atomically extracts packages; electron-builder/cli.js can be
        # absent even after a successful npm ci.  Re-install just that package if
        # the file is missing, suppressing scripts so nothing crashes.
        shell: pwsh
        run: |
          if (-not (Test-Path "node_modules/electron-builder/cli.js")) {
            Write-Host "electron-builder/cli.js missing — reinstalling..."
            npm install electron-builder@$(node -e "const p=require('./package.json');const v=p.devDependencies['electron-builder']||p.dependencies['electron-builder'];console.log(v.replace(/[\^~]/,''))") --no-save --ignore-scripts
          } else {
            Write-Host "electron-builder/cli.js present"
          }

      - name: Compile Electron main process (TypeScript → JS)
        run: npm run build:electron:main
        env:
          PILOTHOUSE_SERVER_URL: ${{ secrets.PILOTHOUSE_SERVER_URL }}

      - name: Build React frontend
        run: npm run build:electron:frontend
        env:
          PILOTHOUSE_SERVER_URL: ${{ secrets.PILOTHOUSE_SERVER_URL }}

      # Verify that the compiled env-constants.js exports the expected server URL
      # before packaging.  tsc emits BAKED_SERVER_URL to dist/electron/env-constants.js
      # (not main.js), so we check that file for the precise export assignment.
      # A missing or incorrect value here means staff machines would connect to
      # the wrong host after installing.
      - name: Verify SERVER_URL is baked into compiled env-constants.js
        shell: pwsh
        run: |
          $url = "${{ secrets.PILOTHOUSE_SERVER_URL }}"
          if (-not $url) { $url = "https://pilothouse.replit.app" }
          $content = Get-Content dist/electron/env-constants.js -Raw
          # Match the exact CommonJS export assignment tsc emits, e.g.:
          #   exports.BAKED_SERVER_URL = 'https://pilothouse.replit.app';
          $pattern = "exports\.BAKED_SERVER_URL\s*=\s*['""]" + [regex]::Escape($url) + "['""]"
          if ($content -notmatch $pattern) {
            Write-Error "exports.BAKED_SERVER_URL = '$url' not found in dist/electron/env-constants.js"
            Write-Error "Actual content: $content"
            exit 1
          }
          Write-Host "✓ SERVER_URL verified in dist/electron/env-constants.js: $url"

      - name: Package and publish Windows installer
        run: node node_modules/electron-builder/cli.js --win --publish always
        env:
          PILOTHOUSE_SERVER_URL: ${{ secrets.PILOTHOUSE_SERVER_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── macOS ─────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS installer
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Ensure electron-builder CLI is present
        run: |
          if [ ! -f "node_modules/electron-builder/cli.js" ]; then
            echo "electron-builder/cli.js missing — reinstalling..."
            EB_VER=$(node -e "const p=require('./package.json');const v=p.devDependencies['electron-builder']||p.dependencies['electron-builder'];console.log(v.replace(/[\^~]/,''))")
            npm install electron-builder@${EB_VER} --no-save --ignore-scripts
          else
            echo "electron-builder/cli.js present"
          fi

      # ── Pre-build certificate guard ──────────────────────────────────────────
      # Fail fast if the signing certificate is missing or within 30 days of
      # expiry so CI never silently ships a Gatekeeper-blocked unsigned DMG.
      - name: Verify code-signing certificate is present and not near expiry
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # ── 1. Ensure the secret is populated ───────────────────────────────
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "ERROR: APPLE_CERTIFICATE secret is not set." >&2
            echo "  → Add a base64-encoded Developer ID Application .p12 to GitHub Secrets." >&2
            echo "  → Run: openssl base64 -in cert.p12 | pbcopy" >&2
            exit 1
          fi

          # ── 2. Decode the p12 ───────────────────────────────────────────────
          echo "$APPLE_CERTIFICATE" | base64 -D > /tmp/ci_check_cert.p12

          # ── 3. Extract the leaf certificate (PEM) ───────────────────────────
          # Try modern openssl first, then fall back to legacy for older p12 exports
          if ! openssl pkcs12 \
                -in /tmp/ci_check_cert.p12 \
                -nokeys \
                -passin pass:"${APPLE_CERTIFICATE_PASSWORD}" \
                -out /tmp/ci_check_cert.pem 2>/dev/null; then
            openssl pkcs12 -legacy \
              -in /tmp/ci_check_cert.p12 \
              -nokeys \
              -passin pass:"${APPLE_CERTIFICATE_PASSWORD}" \
              -out /tmp/ci_check_cert.pem
          fi

          rm -f /tmp/ci_check_cert.p12

          # ── 4. Read the expiry date ─────────────────────────────────────────
          # openssl prints:  notAfter=Nov 10 12:00:00 2025 GMT
          EXPIRY_RAW=$(openssl x509 -in /tmp/ci_check_cert.pem -noout -enddate \
                         | cut -d= -f2)
          rm -f /tmp/ci_check_cert.pem

          # BSD date (macOS runners) format string for "Nov 10 12:00:00 2025 GMT"
          EXPIRY_EPOCH=$(date -j -f "%b %d %H:%M:%S %Y %Z" "$EXPIRY_RAW" +%s)
          NOW_EPOCH=$(date +%s)
          DAYS_LEFT=$(( (EXPIRY_EPOCH - NOW_EPOCH) / 86400 ))

          # ── 5. Gate on expiry ───────────────────────────────────────────────
          if [ "$DAYS_LEFT" -le 0 ]; then
            echo "ERROR: Developer ID Application certificate has EXPIRED." >&2
            echo "  Expiry : $EXPIRY_RAW" >&2
            echo "  Renew the certificate and update the APPLE_CERTIFICATE secret." >&2
            exit 1
          fi

          if [ "$DAYS_LEFT" -le 30 ]; then
            echo "ERROR: Developer ID Application certificate expires in ${DAYS_LEFT} day(s) ($EXPIRY_RAW)." >&2
            echo "  Builds will start failing when the cert expires." >&2
            echo "  Renew the certificate and update the APPLE_CERTIFICATE secret now." >&2
            exit 1
          fi

          echo "✓ Certificate valid for ${DAYS_LEFT} more day(s) (expires ${EXPIRY_RAW})"

      # Import the Developer ID Application certificate into a temporary
      # keychain so electron-builder can find it by name during code-signing.
      - name: Import code-signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Decode the base64 certificate to a temporary file
          # Use -D (BSD base64 on macOS runners) rather than --decode (GNU-only)
          echo "$APPLE_CERTIFICATE" | base64 -D > /tmp/certificate.p12

          # Create a dedicated temporary keychain so we don't touch login.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          # Import the certificate
          security import /tmp/certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild

          # Allow codesign to access the key without an interactive prompt
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Widen the keychain search list so the default keychain is still consulted
          security list-keychains -d user -s build.keychain login.keychain

          # Clean up the p12 file from disk
          rm /tmp/certificate.p12

      - name: Compile Electron main process (TypeScript → JS)
        run: npm run build:electron:main
        env:
          PILOTHOUSE_SERVER_URL: ${{ secrets.PILOTHOUSE_SERVER_URL }}

      - name: Build React frontend
        run: npm run build:electron:frontend
        env:
          PILOTHOUSE_SERVER_URL: ${{ secrets.PILOTHOUSE_SERVER_URL }}

      # electron-builder reads CSC_LINK / CSC_KEY_PASSWORD for signing and
      # our afterSign hook (electron/notarize.js) reads APPLE_ID,
      # APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID for notarization.
      # Same URL verification as the Windows step — check dist/electron/env-constants.js
      # (where tsc emits the BAKED_SERVER_URL export) before signing and notarizing.
      - name: Verify SERVER_URL is baked into compiled env-constants.js
        run: |
          URL="${{ secrets.PILOTHOUSE_SERVER_URL }}"
          if [ -z "$URL" ]; then URL="https://pilothouse.replit.app"; fi
          # Match the exact CommonJS export tsc emits, e.g.:
          #   exports.BAKED_SERVER_URL = 'https://pilothouse.replit.app';
          if ! grep -qE "exports\.BAKED_SERVER_URL\s*=\s*['\"]${URL}['\"]" dist/electron/env-constants.js; then
            echo "ERROR: exports.BAKED_SERVER_URL = '$URL' not found in dist/electron/env-constants.js" >&2
            echo "--- actual content ---" >&2
            cat dist/electron/env-constants.js >&2
            exit 1
          fi
          echo "✓ SERVER_URL verified in dist/electron/env-constants.js: $URL"

      - name: Package, sign, notarize, and publish macOS DMG
        run: node node_modules/electron-builder/cli.js --mac --publish always
        env:
          PILOTHOUSE_SERVER_URL: ${{ secrets.PILOTHOUSE_SERVER_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Certificate already imported into the keychain above;
          # electron-builder auto-detects the identity from the keychain.
          # CSC_KEY_PASSWORD must still be provided so it can unlock the key.
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Notarization credentials consumed by electron/notarize.js
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # ── Post-build Gatekeeper verification ───────────────────────────────────
      # Mount each DMG produced by electron-builder, then run the same checks
      # Gatekeeper performs on a fresh Mac:
      #   1. codesign --verify --deep --strict  — cert chain + entitlements OK
      #   2. xcrun stapler validate             — notarization ticket stapled
      #   3. spctl --assess --type execute      — Gatekeeper would silently open it
      # The job fails here rather than after distributing to staff if any check fails.
      - name: Verify Gatekeeper acceptance of built DMGs
        run: |
          set -euo pipefail

          # electron-builder places DMGs in dist/installers/
          DMG_DIR="dist/installers"
          PASS=0
          FAIL=0

          for DMG in "$DMG_DIR"/*.dmg; do
            [ -f "$DMG" ] || { echo "No DMGs found in $DMG_DIR"; exit 1; }
            echo ""
            echo "══════════════════════════════════════════════════════"
            echo "  Verifying: $(basename "$DMG")"
            echo "══════════════════════════════════════════════════════"

            # Mount the DMG (quietly, agree to any EULA automatically)
            MOUNT_POINT=$(mktemp -d)
            hdiutil attach "$DMG" -mountpoint "$MOUNT_POINT" -nobrowse -quiet

            # Find the .app inside the mounted volume
            APP_PATH=$(find "$MOUNT_POINT" -maxdepth 1 -name "*.app" | head -1)
            if [ -z "$APP_PATH" ]; then
              echo "ERROR: No .app bundle found inside $DMG" >&2
              hdiutil detach "$MOUNT_POINT" -quiet || true
              FAIL=$((FAIL + 1))
              continue
            fi
            echo "  App bundle: $APP_PATH"

            # 1. Code-signature integrity (cert chain + entitlements)
            echo ""
            echo "  [1/3] codesign --verify --deep --strict"
            if codesign --verify --deep --strict --verbose=2 "$APP_PATH" 2>&1; then
              echo "  ✓ Code-signature valid"
            else
              echo "  ✗ Code-signature check FAILED" >&2
              hdiutil detach "$MOUNT_POINT" -quiet || true
              FAIL=$((FAIL + 1))
              continue
            fi

            # 2. Notarization ticket stapled
            echo ""
            echo "  [2/3] xcrun stapler validate"
            if xcrun stapler validate "$APP_PATH" 2>&1; then
              echo "  ✓ Notarization ticket stapled"
            else
              echo "  ✗ Stapler validation FAILED" >&2
              hdiutil detach "$MOUNT_POINT" -quiet || true
              FAIL=$((FAIL + 1))
              continue
            fi

            # 3. Gatekeeper assessment (simulates what a fresh Mac would do)
            echo ""
            echo "  [3/3] spctl --assess --type execute"
            if spctl --assess --type execute --verbose "$APP_PATH" 2>&1; then
              echo "  ✓ Gatekeeper accepts the app"
            else
              echo "  ✗ Gatekeeper assessment FAILED" >&2
              hdiutil detach "$MOUNT_POINT" -quiet || true
              FAIL=$((FAIL + 1))
              continue
            fi

            hdiutil detach "$MOUNT_POINT" -quiet || true
            PASS=$((PASS + 1))
            echo ""
            echo "  ✓ $(basename "$DMG") passes all Gatekeeper checks"
          done

          echo ""
          echo "══════════════════════════════════════════════════════"
          echo "  Results: $PASS passed, $FAIL failed"
          echo "══════════════════════════════════════════════════════"

          if [ "$FAIL" -gt 0 ]; then
            echo "ERROR: $FAIL DMG(s) failed Gatekeeper verification." >&2
            exit 1
          fi

      # Delete the temporary keychain to keep the runner clean
      - name: Clean up keychain
        if: always()
        run: security delete-keychain build.keychain || true
