<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#ea580c" />
    <meta name="description" content="Animal House Pet Store - Exotic reptiles, pet supplies, and professional grooming services" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Animal House" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Animal House" />
    <meta name="msapplication-TileColor" content="#ea580c" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-192x192.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96x96.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-72x72.png" />
    
    <title>Animal House Pet Store</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Auto-reload on Vite HMR reconnection to fix blank screen after updates
      if (import.meta.hot) {
        let disconnected = false;
        import.meta.hot.on('vite:ws:disconnect', () => { disconnected = true; });
        import.meta.hot.on('vite:ws:connect', () => { if (disconnected) location.reload(); });
      }
    </script>
    <script type="module" src="/src/main.tsx?v=20251023164100"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
